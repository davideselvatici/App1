@font-face { font-family: "Bricolage Grotesque"; src: url(bricolage-grotesque.woff2) format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(plex-sans-400.woff2) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(plex-sans-500.woff2) format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(plex-sans-600.woff2) format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(plex-mono-400.woff2) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(plex-mono-500.woff2) format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Unbounded"; src: url(unbounded-600.woff2) format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }

:root {
  color-scheme: light;
  --paper: #f7f7f2;
  --card: #ffffff;
  --sunk: #f4f5ef;
  --hover: #f7f9f4;
  --chip: #eef2e9;
  --ink: #24382e;
  --ink-2: #526357;
  --muted: #667163;
  --rule: #e7ebe3;
  --baseline: #dce2d6;
  --accent: #2b614a;
  --accent-ink: #ffffff;
  --accent-soft: #edf3e9;
  --bar-rest: #cbd8bf;
  --warn: #805b1b;
  --warn-soft: #fcf5e6;
  --warn-bar: #c99b4a;
  --good: #327559;
  --in-bar: #dbe9df;
  --bad: #ae483b;
  --hero-bg: #285a44;
  --hero-muted: #c1d8c8;
  --backdrop: rgba(19, 35, 27, .45);
  --shadow: 0 4px 28px rgba(36, 56, 46, .035);
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-brand: "Unbounded", "Bricolage Grotesque", system-ui, sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #111c16; --card: #1a2820; --sunk: #15221b; --hover: #223329;
    --chip: #27372c; --ink: #e7eee3; --ink-2: #bdc9bb; --muted: #a0af9e;
    --rule: #2c3a2e; --baseline: #3b4d3a; --accent: #add3ac; --accent-ink: #173324;
    --accent-soft: #273c2c; --bar-rest: #52664b; --warn: #e2bd76; --warn-soft: #332b1c;
    --good: #97c9a5; --in-bar: #2c4535; --bad: #ed9b8b; --hero-bg: #244f3a; --hero-muted: #c1d8c8;
    --backdrop: rgba(0, 10, 4, .65); --shadow: 0 4px 28px rgba(0, 0, 0, .08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #111c16; --card: #1a2820; --sunk: #15221b; --hover: #223329;
  --chip: #27372c; --ink: #e7eee3; --ink-2: #bdc9bb; --muted: #a0af9e;
  --rule: #2c3a2e; --baseline: #3b4d3a; --accent: #add3ac; --accent-ink: #173324;
  --accent-soft: #273c2c; --bar-rest: #52664b; --warn: #e2bd76; --warn-soft: #332b1c;
  --good: #97c9a5; --in-bar: #2c4535; --bad: #ed9b8b; --hero-bg: #244f3a; --hero-muted: #c1d8c8;
  --backdrop: rgba(0, 10, 4, .65); --shadow: 0 4px 28px rgba(0, 0, 0, .08);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-text-size-adjust: 100%; }
body.lock { overflow: hidden; }
img { max-width: 100%; }
svg { display: block; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
a { color: var(--accent); }
:where(button, a, select, summary, input):focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.app-rail { display: none; }
.brand-mark { width: 38px; height: 38px; flex: none; display: block; object-fit: contain; background: #2b614a; border-radius: 12px; }
.mobile-brand { display: flex; align-items: center; gap: 9px; font: 600 18px/1 var(--font-brand); letter-spacing: .05em; text-transform: uppercase; }
.mobile-brand .brand-mark { width: 30px; height: 30px; border-radius: 9px; }
.page { max-width: 1040px; margin-inline: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(108px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 28px; }
.topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px 12px; }
.mobile-brand { grid-area: 1 / 1; }
.header-copy { grid-area: 2 / 1 / auto / -1; }
.topbar > .btn { grid-area: 1 / 2; }
.brand { margin: 0; font: 600 clamp(27px, 4.1vw, 38px)/1.12 var(--font-display); letter-spacing: -.035em; }
.content { display: flex; flex-direction: column; gap: 22px; }
.btn { appearance: none; border: 0; border-radius: 12px; min-height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; transition: background .18s, transform .18s, box-shadow .18s; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(36, 72, 46, .15); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-quiet { background: var(--card); color: var(--ink); border: 1px solid var(--rule); }
.btn-quiet:hover { background: var(--hover); }
.linkish { min-height: 44px; border: 0; background: transparent; padding: 10px 0; cursor: pointer; color: var(--accent); font-weight: 500; text-align: left; text-underline-offset: 4px; }
.linkish:hover { text-decoration: underline; }
.linkish.danger { color: var(--bad); }
.sample { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; border: 1px dashed var(--baseline); border-radius: 14px; padding: 12px 16px; }
.sample-copy { flex: 1 1 220px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; }
.sample p { margin: 0; font-size: 13px; color: var(--ink-2); }
.tag-sample { display: inline-flex; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; }
.sample .linkish { min-height: 32px; padding: 0; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.sample .linkish svg { width: 15px; height: 15px; }
.overview { display: flex; flex-direction: column; gap: 18px; }
.monthbar { display: flex; flex-direction: column; gap: 8px; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.month-pick { position: relative; min-width: 0; flex: 1; }
.month-pick select { appearance: none; width: 100%; padding: 8px 30px 8px 0; min-height: 44px; border: 0; border-radius: 8px; background: transparent; font: 600 22px/1.3 var(--font-display); letter-spacing: -.03em; text-overflow: ellipsis; cursor: pointer; }
.month-pick select option { color: var(--ink); background: var(--card); font: 16px var(--font-body); }
.month-pick svg { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.round { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); cursor: pointer; }
.round svg { width: 17px; height: 17px; }
.round:hover:enabled { background: var(--accent-soft); }
.round:disabled { opacity: .4; cursor: default; }
.accounts { margin: 0; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.accounts span { padding: 3px 9px; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
.hero { position: relative; background: var(--hero-bg); color: #ffffff; border-radius: 26px; padding: 28px 24px 22px; overflow: hidden; }
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.hero-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 500; color: var(--hero-muted); letter-spacing: .025em; }
.hero-value { margin: 0; font: 600 clamp(34px, 10.8vw, 64px)/1.06 var(--font-display); letter-spacing: -.055em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-sub { margin: 0; color: var(--hero-muted); font-size: 12px; text-wrap: pretty; }
.hero-visual { display: flex; align-items: center; gap: 20px; justify-content: space-around; }
.donut { width: 108px; height: 108px; flex: none; position: relative; }
.donut svg { width: 100%; height: 100%; overflow: visible; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
.donut-center b { font: 500 28px/1.1 var(--font-display); letter-spacing: -.04em; }
.donut-center span { font-size: 9px; color: var(--hero-muted); }
.delta { display: inline-flex; width: fit-content; align-items: center; gap: 6px; margin: 2px 0 0; padding: 5px 9px; border: 1px solid rgba(255, 255, 255, .17); border-radius: 7px; font-size: 12px; color: #e4f2e6; }
.delta svg { width: 14px; height: 14px; flex: none; }
.delta.more { color: #ffdbca; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; list-style: none; padding: 20px 0 0; margin: 24px 0 0; border-top: 1px solid rgba(255, 255, 255, .16); }
.facts li { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.facts span { font-size: 11px; color: var(--hero-muted); }
.facts b { color: #fff; font-size: 18px; font-weight: 500; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.facts small { font-size: 11px; color: var(--hero-muted); }
.facts .neg b { color: #ffdbca; }
.attn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn-bar) 20%, transparent); border-radius: 16px; overflow: hidden; }
.attn-head { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; padding: 15px 18px; color: var(--warn); font-weight: 500; }
.attn-head > svg { width: 21px; height: 21px; flex: none; }
.attn-head .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.chev { transition: transform .2s; }
.attn-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.attn-act { margin: 0; padding: 0 18px 14px 51px; display: flex; align-items: center; gap: 10px; color: var(--warn); font-size: 13px; }
.attn-act .linkish { min-height: 30px; color: var(--warn); padding: 2px 0; text-decoration: underline; }
.attn .txlist { margin: 0; border-radius: 0; }
.dashboard, .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
.guide { display: flex; flex-direction: column; gap: 22px; }
.main-stack, .side-stack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 5px 12px; padding: 22px 22px 14px; }
.card-title { margin: 0; font: 600 20px/1.25 var(--font-display); letter-spacing: -.025em; }
.card-note { color: var(--muted); font-size: 11px; }
.rows { list-style: none; padding: 0 0 7px; margin: 0; }
.row + .row { border-top: 1px solid var(--rule); }
.row-btn { border: 0; width: 100%; background: transparent; text-align: left; cursor: pointer; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto 14px; gap: 6px 10px; align-items: center; padding: 17px 20px; }
.row-btn:hover { background: var(--hover); }
.category-symbol { grid-row: 1 / span 3; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: var(--category, var(--accent)); background: color-mix(in srgb, var(--category, var(--accent)) 12%, var(--card)); flex: none; }
.category-symbol svg { width: 19px; height: 19px; }
.row-name { font-weight: 500; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.row-amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row-chevron { grid-column: 4; grid-row: 1 / span 3; width: 14px; height: 14px; color: var(--muted); transition: transform .2s; }
.row-btn[aria-expanded="true"] .row-chevron { transform: rotate(90deg); }
.track { grid-column: 2 / 4; height: 4px; background: var(--sunk); border-radius: 8px; overflow: hidden; margin-top: 3px; }
.fill { display: block; height: 100%; background: var(--category, var(--accent)); border-radius: 8px; min-width: 2px; }
.row-meta { grid-column: 2 / 4; font-size: 11px; color: var(--muted); }
.row.warn .row-name { color: var(--warn); }
.row.zero .row-amt { color: var(--muted); font-weight: 400; }
.row-simple .category-symbol, .row-simple .row-chevron { grid-row: 1 / span 2; }
.empty { padding: 10px 22px 24px; color: var(--muted); }
.txlist { list-style: none; padding: 4px 0; margin: 0 14px 14px; background: var(--sunk); border-radius: 12px; }
.txlist li + li { border-top: 1px solid var(--rule); }
.txlist.nested { margin: 0 12px 10px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; }
.tx-btn { width: 100%; border: 0; padding: 12px 12px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 3px 9px; align-items: baseline; text-align: left; background: transparent; cursor: pointer; }
.tx-btn:hover { background: var(--hover); }
.tx-date { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tx-name { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.tx-amt { font-size: 13px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amt.in { color: var(--good); }
.tx-sub { grid-column: 2 / -1; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.tag { display: inline-block; padding: 2px 5px; margin-left: 5px; border-radius: 4px; color: var(--ink-2); background: var(--chip); font-size: 9px; line-height: 1.3; white-space: nowrap; font-weight: 500; }
.key.in::before { background: var(--in-bar); box-shadow: inset 0 0 0 1.5px var(--good); }
.flow-notes { margin: 0; padding: 0 22px 18px; color: var(--muted); font-size: 11px; }
.highlights { list-style: none; margin: 0; padding: 0 0 6px; }
.hl + .hl { border-top: 1px solid var(--rule); }
.hl-item { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; padding: 14px 22px; }
button.hl-item { cursor: pointer; }
button.hl-item:hover { background: var(--hover); }
.hl-label, .hl-sub { font-size: 11px; color: var(--muted); }
.hl-title { font-weight: 500; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.hl-amt { grid-column: 3; grid-row: 1 / span 3; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.hl-amt.up { color: var(--warn); }
.hl-amt.down { color: var(--good); }
.trend { display: flex; align-items: flex-end; gap: 8px; padding: 32px 20px 20px; overflow-x: auto; }
.col { flex: 1 0 35px; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 9px; }
.col-plot { width: 100%; height: 110px; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 3px; border-bottom: 1px solid var(--rule); }
.col-bar { display: block; width: 27px; max-width: 75%; border-radius: 7px 7px 0 0; background: var(--bar-rest); transition: background .2s; }
.paired .col-bar { width: 12px; max-width: 42%; border-radius: 5px 5px 0 0; }
.col-bar.in { background: var(--in-bar); box-shadow: inset 0 0 0 1.5px var(--good); }
.col:hover .col-bar.out, .col[aria-pressed="true"] .col-bar.out { background: var(--accent); }
.col-avg { position: absolute; left: -4px; right: -4px; border-top: 1px dashed var(--muted); opacity: .75; pointer-events: none; }
.col-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink); white-space: nowrap; }
.col-lab { font-size: 11px; color: var(--muted); }
.col[aria-pressed="true"] .col-lab { color: var(--accent); font-weight: 600; }
.trend-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0 22px 16px; color: var(--muted); font-size: 11px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--bar-rest); flex: none; }
.key.avg::before { width: 14px; height: 0; border-radius: 0; background: none; border-top: 1px dashed var(--muted); }
.trend-note { margin: 0; padding: 0 22px 18px; color: var(--muted); font-size: 11px; }
.online-summary, .help summary { display: flex; align-items: center; gap: 12px; padding: 21px 20px; cursor: pointer; list-style: none; min-height: 80px; }
summary::-webkit-details-marker { display: none; }
.setting-symbol { width: 38px; height: 38px; flex: none; display: grid; place-items: center; background: var(--accent-soft); border-radius: 12px; color: var(--accent); }
.setting-symbol svg { width: 18px; height: 18px; }
.setting-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.setting-title { font: 500 16px/1.25 var(--font-display); letter-spacing: -.02em; }
.setting-sub { color: var(--muted); font-size: 11px; }
.free-badge { color: var(--accent); background: var(--accent-soft); border: 1px solid var(--rule); border-radius: 6px; font-size: 10px; font-weight: 500; padding: 3px 6px; flex: none; }
.summary-chevron { width: 16px; height: 16px; color: var(--muted); flex: none; transition: transform .2s; }
details[open] > summary .summary-chevron { transform: rotate(90deg); }
.help { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.help-body { padding: 0 20px 22px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
.help-body p { margin: 0; }
.fine { font-size: 12px; color: var(--muted); }
.fine a { color: var(--accent); font-weight: 500; text-underline-offset: 3px; }
.data { padding: 0 22px 22px; display: flex; flex-direction: column; gap: 13px; font-size: 13px; }
.data p { margin: 0; }
.online-keys { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; margin: 4px 0; }
.online-keys label { display: flex; flex-direction: column; gap: 7px; width: 100%; color: var(--ink-2); font-size: 12px; font-weight: 500; }
.online-keys input, .online-keys select { width: 100%; min-height: 46px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 11px; background: var(--sunk); font-size: 16px; }
input::placeholder { color: var(--muted); font-weight: 400; }
.providers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 12px; line-height: 1.45; color: var(--muted); }
.providers a { font-weight: 500; }
.online-busy { display: flex; gap: 10px; align-items: center; color: var(--accent); font-weight: 500; }
.spin { width: 16px; height: 16px; flex: none; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.files { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.files li { min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--sunk); border-radius: 11px; font-size: 12px; }
.files .mono { color: var(--muted); overflow-wrap: anywhere; font-size: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 2px 20px; font-size: 12px; }
.foot { margin: 2px auto 0; max-width: 650px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.7; text-wrap: balance; }
.toast { position: fixed; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; left: 16px; right: 16px; max-width: 560px; margin-inline: auto; padding: 14px 18px; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.15); background: var(--ink); color: var(--card); font-size: 13px; }
.toast.err { background: #ae483b; color: #fff; }
.mobile-nav { position: fixed; z-index: 10; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--rule); padding: 7px max(10px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; box-shadow: 0 -4px 20px rgba(20,40,20,.025); }
.mobile-nav a, .mobile-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 48px; padding: 0 2px; border: 0; background: transparent; cursor: pointer; color: var(--muted); text-decoration: none; text-align: center; font-size: 10px; line-height: 1.2; border-radius: 10px; }
.mobile-nav a svg, .mobile-nav button svg { width: 19px; height: 19px; flex: none; }
.mobile-nav a[aria-current="location"] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.backdrop { position: fixed; inset: 0; z-index: 20; background: var(--backdrop); backdrop-filter: blur(3px); }
.sheet { position: fixed; z-index: 21; bottom: 0; left: 0; right: 0; max-width: 580px; max-height: 90vh; max-height: 90dvh; margin-inline: auto; padding: 12px 22px calc(24px + env(safe-area-inset-bottom, 0px)); border-radius: 28px 28px 0 0; background: var(--card); overflow-y: auto; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 50px rgba(0, 0, 0, .13); animation: sheet-up .22s ease-out; }
@keyframes sheet-up { from { transform: translateY(20px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 34px; height: 4px; border-radius: 3px; background: var(--baseline); align-self: center; margin-bottom: 5px; }
.sheet-close { position: absolute; right: 16px; top: 12px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--sunk); cursor: pointer; }
.sheet-close svg { width: 16px; height: 16px; }
.sheet-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: baseline; padding-top: 10px; }
.sheet-kicker { grid-column: 1 / -1; margin: 0; font-size: 11px; color: var(--muted); }
.sheet h2 { margin: 0; outline: none; font: 600 26px/1.15 var(--font-display); letter-spacing: -.035em; overflow-wrap: anywhere; }
.sheet-amt { font-size: 20px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sheet-amt.in { color: var(--good); }
.sheet-desc { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.sheet-now { margin: 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; font-size: 13px; }
.sheet-now span { color: var(--muted); }
.remember { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; font-size: 13px; cursor: pointer; }
.remember input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.remember span { display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
.remember small { color: var(--muted); font-size: 11px; font-weight: 400; }
.group-label { margin: 0; color: var(--muted); font-size: 11px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; border: 1px solid var(--rule); padding: 0 13px; border-radius: 10px; background: var(--card); cursor: pointer; font-size: 12px; font-weight: 400; }
.chip:hover { background: var(--hover); }
.chip svg { width: 15px; height: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.newcat { display: flex; gap: 8px; }
.newcat input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sunk); font-size: 16px; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.install { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px 20px; background: var(--accent-soft); border: 1px solid var(--rule); border-radius: 14px; font-size: 13px; }
.install p { margin: 0; }
.install-title { font-weight: 500; }
.install-row { display: flex; flex-wrap: wrap; gap: 4px 18px; }

@media (min-width: 640px) {
  .page { padding-inline: 30px; gap: 34px; }
  .hero { padding: 32px 32px 26px; }
  .hero-top { grid-template-columns: minmax(0, 1fr) auto; gap: 28px; }
  .hero-visual { gap: 18px; }
  .donut { width: 148px; height: 148px; }
  .donut-center b { font-size: 32px; }
  .donut-center span { font-size: 11px; }
  .hero-value { font-size: 64px; }
  .monthbar { flex-direction: row; justify-content: space-between; align-items: center; gap: 24px; }
  .monthnav { min-width: 285px; }
  .accounts { justify-content: flex-end; }
  .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts b { font-size: 22px; }
  .facts span { font-size: 12px; }
  .mobile-nav { max-width: 440px; margin-inline: auto; border: 1px solid var(--rule); bottom: 14px; border-radius: 18px; box-shadow: 0 6px 30px rgba(36,56,46,.1); }
  .sheet { border-radius: 28px; bottom: 24px; max-height: calc(100dvh - 48px); }
}
@media (min-width: 900px) {
  .dashboard { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .row-btn { padding: 19px 22px; gap: 8px 12px; }
  .row-name { font-size: 15px; }
  .row-amt { font-size: 17px; }
  .hero-visual { gap: 26px; }
  .donut { width: 170px; height: 170px; }
}
@media (min-width: 1100px) {
  .app-rail { display: flex; flex-direction: column; width: 224px; position: fixed; inset: 0 auto 0 0; padding: 38px 20px 26px; border-right: 1px solid var(--rule); background: var(--card); z-index: 12; }
  .rail-brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; color: var(--ink); text-decoration: none; font: 600 20px/1.1 var(--font-brand); letter-spacing: .05em; text-transform: uppercase; }
  .rail-nav { display: flex; flex-direction: column; gap: 7px; margin-top: 48px; }
  .rail-nav a, .rail-nav button { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; color: var(--ink-2); text-decoration: none; text-align: left; font-size: 13px; }
  .rail-nav svg { width: 18px; height: 18px; flex: none; }
  .rail-nav a:hover, .rail-nav button:hover { background: var(--hover); }
  .rail-nav a[aria-current="location"] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .rail-bottom { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid var(--rule); }
  .rail-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; }
  .status-dot { width: 6px; height: 6px; background: var(--good); border-radius: 50%; }
  .page { max-width: 1400px; margin-left: 224px; margin-right: auto; padding: 40px clamp(28px, 3.4vw, 64px) 48px; gap: 34px; }
  .topbar { align-items: center; }
  .header-copy { grid-area: 1 / 1; }
  .mobile-brand, .mobile-nav { display: none; }
  .brand { font-size: 36px; }
  .topbar > .btn { min-height: 46px; }
  .content { gap: 24px; }
  .toast { bottom: 24px; left: 240px; right: 24px; }
}
@media (max-width: 359px) {
  .mobile-brand { font-size: 16px; gap: 7px; }
  .mobile-brand .brand-mark { width: 27px; height: 27px; }
  .topbar > .btn { padding: 0 11px; font-size: 12px; gap: 6px; }
  .brand { font-size: 26px; }
  .hero { padding-inline: 20px; }
  .hero-visual { gap: 14px; }
  .donut { width: 88px; height: 88px; }
  .donut-center b { font-size: 23px; }
  .donut-center span { font-size: 8px; }
  .row-btn { grid-template-columns: 32px minmax(0, 1fr) auto 12px; padding-inline: 14px; gap: 6px 8px; }
  .category-symbol { width: 32px; height: 32px; border-radius: 10px; }
  .row-name { font-size: 12px; }
  .row-amt { font-size: 13px; }
  .card-head { padding-inline: 18px; }
  .sheet { padding-inline: 18px; }
}
@media (max-width: 639px) {
  .sample { padding: 11px 13px; gap: 7px 10px; }
  .sample-copy { flex: 1 1 auto; }
  .sample p { display: none; }
  .sample .linkish { font-size: 12px; }
  /* Sul telefono entrate, uscite e saldo vanno in colonna: anche cifre a cinque zeri stanno su una riga. */
  .hero-value.long { font-size: clamp(24px, 8vw, 64px); }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 16px; margin-top: 20px; }
  .facts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 12px; }
  .facts span { font-size: 12px; }
  .facts b { font-size: 17px; white-space: nowrap; }
  .facts small { grid-column: 1 / -1; text-align: right; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

      } else if (c === '"') q = true;

      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  function parseAmount(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).trim().replace(/\s| /g, '').replace(/€|EUR/gi, '').replace(/−/g, '-');
    if (!s) return NaN;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    if (/^\+/.test(s)) s = s.slice(1);
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = ((s.match(/,/g) || []).length === 1 && s.length - lc - 1 <= 2) ? s.replace(',', '.') : s.replace(/,/g, '');
    else if (ld > -1 && ((s.match(/\./g) || []).length > 1 || s.length - ld - 1 === 3)) s = s.replace(/\./g, '');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    const n = Number(s);
    return neg ? -Math.abs(n) : n;
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function validYmd(y, m, d) {
    y = +y; m = +m; d = +d;
    if (!(y > 1990 && y < 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
    return y + '-' + pad(m) + '-' + pad(d);
  }
  function parseDate(v) {
    if (v instanceof Date && !isNaN(v)) return validYmd(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      const d = new Date(Math.round((v - 25569) * 86400000));
      return validYmd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    const s = String(v == null ? '' : v).trim();
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) return validYmd(m[1], m[2], m[3]);
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (m) return +m[2] > 12 && +m[1] <= 12 ? validYmd(m[3], m[1], m[2]) : validYmd(m[3], m[2], m[1]);
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return validYmd(m[1], m[2], m[3]);
    // Mese scritto, come negli estratti consolidati di Revolut: «1 set 2026», «1 Sep 2026», «Sep 1, 2026».
    m = s.match(/^(\d{1,2})\.?\s+(\p{L}{3,})\.?\s+(\d{4})\b/u);
    if (m && MONTHS[m[2].slice(0, 3).toLowerCase()]) return validYmd(m[3], MONTHS[m[2].slice(0, 3).toLowerCase()], m[1]);
    m = s.match(/^(\p{L}{3,})\.?\s+(\d{1,2}),?\s+(\d{4})\b/u);
    if (m && MONTHS[m[1].slice(0, 3).toLowerCase()]) return validYmd(m[3], MONTHS[m[1].slice(0, 3).toLowerCase()], m[2]);
    return '';
  }
  const MONTHS = { gen: 1, jan: 1, feb: 2, mar: 3, mrt: 3, apr: 4, mag: 5, may: 5, mei: 5, giu: 6, jun: 6, lug: 7, jul: 7, ago: 8, aug: 8, set: 9, sep: 9, ott: 10, oct: 10, okt: 10, nov: 11, dic: 12, dec: 12 };

  function normHeader(h) { return String(h == null ? '' : h).replace(/^﻿/, '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function findCol(header, names) { for (const n of names) { const i = header.indexOf(n); if (i !== -1) return i; } return -1; }

  /* Movimenti verso salvadanai, fondi e conti di investimento della stessa persona. */
  const REV_INTERNAL = /^(to|from|verso|da|dal|dalla|al|alla|a|naar|van)\b.*\b(pocket|vault|savings|salvadanaio|risparmi|spaar|fondi monetari|money market|flexible|investimento|investment|deposito|deposit)/i;

  /* Identificativo stabile: lo stesso movimento caricato due volte viene riconosciuto. */
  function addTx(out, seen, t) {
    const base = [t.src, t.account, t.date, t.cents, t.cp, t.raw, t.desc].join('|');
    const n = (seen.get(base) || 0) + 1;
    seen.set(base, n);
    t = Object.assign({ id: t.src + '-' + fnv(base) + '-' + n }, t);
    t.key = keyFor(t);
    out.push(t);
  }

  function fileInfo(out, fileName) {
    const m = String(fileName || '').match(/(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/);
    const dates = out.map(t => t.date).sort();
    return { name: String(fileName || 'file'), from: m ? m[1] : (dates[0] || ''), to: m ? m[2] : (dates[dates.length - 1] || ''), count: out.length, src: out[0] ? out[0].src : '' };
  }

  /* Estratto conto consolidato di Revolut (CSV): riepiloghi e poi una tabella per conto, ognuna sotto
     un titolo come «Conto personale (EUR)». Si leggono i movimenti dei conti e i rendimenti di fondi e
     risparmi; per i conti in altre valute si usa la colonna già convertita in euro. */
  const REV_MONEY = ['denaro in entrata/uscita', 'money in/out', 'money in / out'];
  const REV_RETURNS = ['rendimenti netti distribuiti e prelevati', 'net interest', 'interessi netti'];
  const isRevHeader = h => COLS.date.includes(h[0]) && h.some(x => REV_MONEY.includes(x) || REV_RETURNS.includes(x));

  function revolutStatementToTx(rows, fileName) {
    const get = (r, i) => (i === -1 || r[i] == null) ? '' : String(r[i]).trim();
    // Il nome e l'IBAN della persona servono a riconoscere i soldi spostati tra i suoi conti.
    let holder = '', iban = '';
    for (const r of rows) {
      const k = normHeader(r[0]);
      if (!holder && /^(nome del conto|account name|titolare del conto|account holder)$/.test(k) && /^\p{L}[\p{L} .'-]+$/u.test(get(r, 1))) holder = normText(r[1]);
      if (!iban && /iban/.test(k)) iban = cleanIban(r[1]);
    }
    const out = [], seen = new Map();
    let skipped = 0, title = '', cur = 'EUR', table = null;
    for (const row of rows) {
      const h = row.map(normHeader);
      const first = get(row, 0);
      if (isRevHeader(h)) {
        const money = h.flatMap((x, i) => REV_MONEY.includes(x) ? [i] : []);
        const returns = h.flatMap((x, i) => REV_RETURNS.includes(x) ? [i] : []);
        table = { amount: money.length ? money : returns, returns: !money.length, desc: findCol(h, COLS.description), cat: findCol(h, ['categoria', 'category']), account: 'Revolut ' + title + ' ' + cur };
        continue;
      }
      const t = first.match(/^(.*?)\s*\(([A-Z]{3})\)$/);
      if (t && row.slice(1).every(x => String(x == null ? '' : x).trim() === '')) { title = t[1].replace(/\s+/g, ' '); cur = t[2]; table = null; continue; }
      if (!table) continue;
      const date = parseDate(first);
      if (!date) { table = null; continue; } // «Totale» e i separatori chiudono la tabella
      const cells = table.amount.map(i => get(row, i));
      const eur = cells.find(c => /€|EUR/i.test(c));
      const amt = parseAmount(eur !== undefined ? eur : cells[0]);
      if (!Number.isFinite(amt)) { skipped++; continue; }
      const cents = Math.round(amt * 100);
      if (cents === 0) continue;
      const desc = get(row, table.desc), D = normText(desc), category = normText(get(row, table.cat));
      let kind;
      if (table.returns) kind = 'reward';
      else if (/RICARICA|TOP.?UP|CAMBIO|EXCHANGE/.test(category) || REV_INTERNAL.test(desc) || /^(CAMBIATO|EXCHANGED)\b/.test(D)) kind = 'internal';
      else if (/^CANONE\b|PLAN FEE|COMMISSION/.test(D) || /COMMISSION|FEE/.test(category)) kind = 'fee';
      else if (/CASHBACK|REWARD|INTERESS|INTEREST/.test(category)) kind = 'reward';
      else if (/PRELIEV|ATM|CONTANT|CASH/.test(category)) kind = 'atm';
      else if (/ESERCENTE|MERCHANT|CARTA|CARD|RIMBORS|REFUND/.test(category)) kind = 'card';
      else kind = holder && D.includes(holder) ? 'internal' : 'transfer';
      addTx(out, seen, { src: 'revolut', date, cents, cur: eur !== undefined ? 'EUR' : cur, account: table.account, cp: '', raw: desc, desc, kind, ...(iban ? { iban } : {}) });
    }
    return { txs: out, file: fileInfo(out, fileName), skipped };
  }

  function rowsToTx(rows, fileName) {
    rows = (rows || []).filter(r => Array.isArray(r) && r.some(x => String(x == null ? '' : x).trim() !== ''));
    if (rows.some(r => isRevHeader(r.map(normHeader)))) return revolutStatementToTx(rows, fileName);
    let hi = -1, H = null;
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const h = rows[i].map(normHeader);
      const hasAmt = findCol(h, COLS.amount) !== -1;
      const hasDate = [COLS.date, COLS.started, COLS.completed].some(n => findCol(h, n) !== -1);
      if (hasAmt && hasDate) { hi = i; H = h; break; }
    }
    if (hi === -1) {
      const seenCols = (rows[0] || []).map(x => String(x == null ? '' : x).trim()).filter(Boolean).slice(0, 10).join(', ');
      throw new Error(T().noColumns + (seenCols ? T().seenColumns + seenCols + '.' : ''));
    }
    const col = k => findCol(H, COLS[k]);
    const iStart = col('started'), iDone = col('completed');
    const revolut = iStart !== -1 || iDone !== -1;
    const ix = { date: col('date'), amount: col('amount'), account: col('account'), cp: col('counterparty'), name: col('name'), desc: col('description'), fee: col('fee'), cur: col('currency'), state: col('state'), type: col('type'), product: col('product') };
    const bunqHeader = H.includes('interest date') || H.includes('rentedatum');
    const get = (r, i) => (i === -1 || r[i] == null) ? '' : r[i];
    const out = [], seen = new Map();
    let skipped = 0;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      let date, cents, raw, desc, cp = '', account, cur = 'EUR', kind, src;
      if (revolut) {
        if (/REVERT|DECLIN|FAIL|CANCEL|ANNULL|RIFIUT|STORN|MISLUKT|GEWEIGERD/i.test(String(get(row, ix.state)))) continue;
        date = parseDate(get(row, iStart !== -1 ? iStart : iDone)) || parseDate(get(row, iDone));
        const amt = parseAmount(get(row, ix.amount));
        const fee = parseAmount(get(row, ix.fee));
        cents = Number.isFinite(amt) ? Math.round((amt - (Number.isFinite(fee) ? Math.abs(fee) : 0)) * 100) : NaN;
        desc = String(get(row, ix.desc)).trim();
        raw = desc;
        cur = String(get(row, ix.cur)).trim().toUpperCase() || 'EUR';
        const type = String(get(row, ix.type)).toUpperCase();
        const product = String(get(row, ix.product)).trim();
        if (/TOP.?UP|EXCHANGE|RICARICA|CAMBIO/.test(type) || REV_INTERNAL.test(desc) || /savings|risparmi|deposit|spaar/i.test(product)) kind = 'internal';
        else if (/^FEE$|COMMISSION/.test(type)) kind = 'fee';
        else if (/CASHBACK|REWARD|INTEREST|INTERESSI|RENTE/.test(type)) kind = 'reward';
        else if (/ATM|PRELIEVO/.test(type)) kind = 'atm';
        else if (/TRANSFER|TRASFERIMENTO|BONIFICO|OVERSCHRIJVING/.test(type)) kind = 'transfer';
        else kind = 'card';
        account = 'Revolut' + (product ? ' ' + product : '') + ' ' + cur;
        src = 'revolut';
      } else {
        date = parseDate(get(row, ix.date));
        const amt = parseAmount(get(row, ix.amount));
        cents = Number.isFinite(amt) ? Math.round(amt * 100) : NaN;
        raw = String(get(row, ix.name)).trim();
        desc = String(get(row, ix.desc)).trim();
        if (!raw) raw = desc;
        cp = cleanIban(get(row, ix.cp));
        account = cleanIban(get(row, ix.account)) || String(get(row, ix.account)).trim();
        kind = cp ? 'transfer' : 'card';
        src = bunqHeader || /BUNQ/.test(account) ? 'bunq' : 'csv';
      }
      if (!date || !Number.isFinite(cents)) { skipped++; continue; }
      if (cents === 0) continue;
      addTx(out, seen, { src, date, cents, cur, account, cp, raw, desc, kind });
    }
    return { txs: out, file: fileInfo(out, fileName), skipped };
  }

  function merge(store, parsed) {
    const have = new Set(store.tx.map(t => t.id));
    let added = 0;
    for (const t of parsed.txs) if (!have.has(t.id)) { have.add(t.id); store.tx.push(t); added++; }
    const f = parsed.file;
    if (!store.files.some(x => x.name === f.name && x.from === f.from && x.to === f.to)) store.files.push(f);
    store.tx.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    return added;
  }

  function ownIbans(txs) {
    const s = new Set();
    for (const t of txs) {
      if (IBAN_RE.test(t.account || '')) s.add(t.account);
      if (IBAN_RE.test(t.iban || '')) s.add(t.iban); // conto Revolut letto dall'estratto consolidato
    }
    return s;
  }

  function cashbackMerchant(t) {
    if (!(t.cents > 0) || !/^BUNQ\b/.test(normText(t.raw)) || !CASHBACK_RE.test(t.desc || '')) return null;
    const m = String(t.desc).match(CASHBACK_AT);
    return m ? m[1].trim() : '';
  }

  function matchRules(text, cents) {
    for (const r of RULES) {
      if (r.dir === 'in' && !(cents > 0)) continue;
      if (r.dir === 'out' && !(cents < 0)) continue;
      if (r.re.test(text)) return r.c;
    }
    return '';
  }

  function isCash(t, text) {
    return t.cents < 0 && (CASH_RE.test(text) || (t.kind === 'card' && t.cents % 1000 === 0 && CASH_BANK_RE.test(text)));
  }

  const has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);

  /* Chiave per la ricerca online: i pagamenti con carta valgono per l'esercente,
     i bonifici solo per il singolo movimento (a una persona si pagano cose diverse). */
  function lookupKey(t) {
    return t.kind === 'card' && t.key ? t.key : 'T:' + t.id;
  }

  function autoCategory(t, ctx) {
    if (t.key && has(ctx.rules, t.key)) return { cat: ctx.rules[t.key], how: 'rule' };
    if (t.cp && ctx.own && ctx.own.has(t.cp)) return { cat: 'giroconto', how: 'auto' };
    if (t.kind === 'internal') return { cat: 'giroconto', how: 'auto' };
    if (cashbackMerchant(t) !== null) return { cat: 'interessi', how: 'auto', note: 'cashback' };
    if (t.kind === 'fee') return { cat: 'abbonamenti', how: 'auto' };
    if (t.kind === 'reward') return { cat: 'interessi', how: 'auto' };
    if (t.kind === 'atm') return { cat: 'shopping', how: 'auto', note: 'contanti' };
    const text = normText(t.raw + ' ' + t.desc);
    const c = matchRules(text, t.cents);
    if (c) return { cat: c, how: 'auto' };
    if (isCash(t, text)) return { cat: 'shopping', how: 'auto', note: 'contanti' };
    const k = lookupKey(t);
    if (has(ctx.ai, k) && ctx.ai[k].c) return { cat: ctx.ai[k].c, how: 'online', why: ctx.ai[k].w || '', sources: ctx.ai[k].sources || [] };
    return { cat: '', how: 'none' };
  }

  function categorize(t, ctx) {
    if (has(ctx.overrides, t.id)) return { cat: ctx.overrides[t.id], how: 'manual' };
    const c = autoCategory(t, ctx);
    // I soldi ricevuti da chi ha la categoria di una spesa sono un rimborso. Solo la scelta sul
    // singolo movimento può sottrarli da quella spesa.
    if (t.cents > 0 && c.cat && c.cat !== 'giroconto' && !isIncome(c.cat)) c.cat = 'rimborsi';
    return c;
  }

  /* Movimenti in euro che nessuna regola riconosce e che non sono ancora stati cercati online,
     raggruppati per esercente. I più recenti prima. */
  function lookupItems(txs, ctx) {
    const groups = new Map();
    for (const t of txs) {
      if (t.cur && t.cur !== 'EUR') continue;
      const k = lookupKey(t);
      if (has(ctx.ai, k) || categorize(t, ctx).how !== 'none') continue;
      let g = groups.get(k);
      if (!g) groups.set(k, g = { key: k, t, n: 0 });
      g.n++;
      if (t.date > g.t.date) g.t = t;
    }
    return [...groups.values()].sort((a, b) => b.t.date.localeCompare(a.t.date));
  }

  function daysIn(month) { return new Date(+month.slice(0, 4), +month.slice(5, 7), 0).getDate(); }
  function prevMonth(month) {
    let y = +month.slice(0, 4), m = +month.slice(5, 7) - 1;
    if (m < 1) { m = 12; y--; }
    return y + '-' + pad(m);
  }
  function monthsOf(txs) {
    return [...new Set(txs.filter(t => !t.cur || t.cur === 'EUR').map(t => t.date.slice(0, 7)))].sort();
  }

  function coverage(month, files) {
    const start = month + '-01', end = month + '-' + pad(daysIn(month));
    let from = '', to = '';
    for (const f of files || []) {
      if (!f.from || !f.to || f.to < start || f.from > end) continue;
      const a = f.from > start ? f.from : start, b = f.to < end ? f.to : end;
      if (!from || a < from) from = a;
      if (!to || b > to) to = b;
    }
    return { start, end, from, to, partial: !!from && (from > start || to < end) };
  }

  /* Totali del mese. Uscite (total) = spese, al netto dei soldi ricevuti assegnati a mano a una
     categoria di spesa; entrate (inflow) = stipendio, interessi, rimborsi, soldi ricevuti ancora da
     classificare e soldi assegnati a una spesa oltre quanto speso.
     Il saldo (net) è la somma di tutti i movimenti in euro esclusi i giroconti. */
  function summarize(txs, ctx, month, dFrom, dTo) {
    const cats = new Map(), incomes = new Map();
    const r = { total: 0, unOut: 0, unIn: 0, unTx: [], income: 0, incomeRows: [], internalOut: 0, internalIn: 0, internalTx: [], back: 0, extraBack: 0, inflow: 0, net: 0, count: 0, otherCur: 0, rows: [] };
    for (const t of txs) {
      if (t.date.slice(0, 7) !== month) continue;
      if (dFrom) { const d = +t.date.slice(8, 10); if (d < dFrom || d > dTo) continue; }
      if (t.cur && t.cur !== 'EUR') { r.otherCur++; continue; }
      r.count++;
      const c = categorize(t, ctx);
      const w = { t, cat: c.cat, how: c.how, note: c.note, why: c.why };
      if (c.cat === 'giroconto') { r.internalTx.push(w); if (t.cents < 0) r.internalOut -= t.cents; else r.internalIn += t.cents; }
      else if (isIncome(c.cat)) {
        let g = incomes.get(c.cat);
        if (!g) incomes.set(c.cat, g = { id: c.cat, total: 0, txs: [] });
        g.total += t.cents;
        g.txs.push(w);
        r.income += t.cents;
      }
      else if (!c.cat) { r.unTx.push(w); if (t.cents < 0) r.unOut -= t.cents; else r.unIn += t.cents; }
      else {
        let g = cats.get(c.cat);
        if (!g) cats.set(c.cat, g = { id: c.cat, out: 0, back: 0, spent: 0, txs: [] });
        if (t.cents < 0) g.out -= t.cents; else g.back += t.cents;
        g.txs.push(w);
      }
    }
    for (const g of cats.values()) {
      g.spent = Math.max(0, g.out - g.back);
      r.back += Math.min(g.out, g.back);
      r.extraBack += Math.max(0, g.back - g.out);
      r.rows.push(g);
    }
    r.rows.sort((a, b) => b.spent - a.spent || b.back - a.back);
    r.incomeRows = INCOME.map(c => incomes.get(c.id)).filter(Boolean);
    r.total = r.rows.reduce((s, g) => s + g.spent, 0) + r.unOut;
    r.inflow = r.income + r.unIn + r.extraBack;
    r.net = r.inflow - r.total;
    return r;
  }

  /* Riepiloghi del mese e di quello prima. Se il mese è parziale, il precedente copre gli stessi giorni. */
  function compare(txs, ctx, month, files) {
    const prev = prevMonth(month);
    if (!txs.some(t => t.date.startsWith(prev))) return null;
    const cov = coverage(month, files), pcov = coverage(prev, files);
    if (!cov.from || !pcov.from) return null;
    const pdays = daysIn(prev);
    const d1 = cov.partial ? +cov.from.slice(8) : 1;
    const d2 = cov.partial ? Math.min(+cov.to.slice(8), pdays) : pdays;
    if (+pcov.from.slice(8) > d1 || +pcov.to.slice(8) < d2) return null;
    const now = summarize(txs, ctx, month);
    const before = cov.partial ? summarize(txs, ctx, prev, d1, d2) : summarize(txs, ctx, prev);
    return { prev, partial: cov.partial, now, before };
  }

  /* Variazione delle spese totali, dal risultato di compare. */
  function deltaOf(c) {
    if (!c || !c.before.total) return null;
    return { prev: c.prev, ratio: (c.now.total - c.before.total) / c.before.total, partial: c.partial, now: c.now.total, before: c.before.total };
  }

  /* Variazione di spesa per categoria rispetto al mese prima, la più grande per prima. */
  function categoryChanges(cmp) {
    if (!cmp) return [];
    const before = new Map(cmp.before.rows.map(g => [g.id, g.spent]));
    const now = new Map(cmp.now.rows.map(g => [g.id, g.spent]));
    return [...new Set([...before.keys(), ...now.keys()])]
      .map(id => ({ id, now: now.get(id) || 0, before: before.get(id) || 0 }))
      .map(v => Object.assign(v, { diff: v.now - v.before }))
      .filter(v => v.diff !== 0)
      .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  }

  /* Movimenti della stessa controparte e categoria in una sola voce, nell'ordine della lista:
     per esempio gli interessi giornalieri o i giroconti verso lo stesso conto. */
  function groupTx(ws) {
    const groups = new Map();
    for (const w of ws) {

      let g = groups.get(k);
      if (!g) groups.set(k, g = { key: k, t: w.t, cents: 0, from: w.t.date, to: w.t.date, ws: [] });
      g.cents += w.t.cents;
      if (w.t.date < g.from) g.from = w.t.date;
      if (w.t.date > g.to) g.to = w.t.date;
      g.ws.push(w);
    }
    return [...groups.values()];
  }

  function migrate(s) {
    const map = Object.assign({}, LEGACY);
    const builtIn = CATS.concat(INCOME);
    s.cats = (s.cats || []).filter(c => {
      const same = builtIn.find(x => x.label.toLowerCase() === String(c.label).toLowerCase());
      if (same) map[c.id] = same.id;
      return !same;
    });
    for (const k of ['rules', 'overrides']) {
      const o = s[k] || {};
      for (const key of Object.keys(o)) if (has(map, o[key])) { if (map[o[key]]) o[key] = map[o[key]]; else delete o[key]; }
    }
    const ai = s.ai || {};
    for (const key of Object.keys(ai)) if (ai[key] && has(map, ai[key].c)) { if (map[ai[key].c]) ai[key].c = map[ai[key].c]; else delete ai[key]; }

    const groups = new Map();
    const add = w => {
      const t = w.t, k = t.key || 'N:' + displayName(t);
      let g = groups.get(k);
      if (!g) groups.set(k, g = { key: k, t, spent: 0, txs: [], byCat: new Map() });

      g.txs.push(w);
      if (t.date > g.t.date) g.t = t;
      if (t.cents < 0) g.byCat.set(w.cat, (g.byCat.get(w.cat) || 0) - t.cents);
    };
    for (const g of sum.rows) g.txs.forEach(add);
    for (const w of sum.unTx) if (w.t.cents < 0) add(w);

      .map(g => ({ key: g.key, name: displayName(g.t), cat: [...g.byCat].sort((a, b) => b[1] - a[1])[0][0], spent: g.spent, txs: g.txs }))

    tavilyQuota: 'needed with any model: 1,000 free searches a month',
    activate: 'Turn on for free',
    onlinePrivacy: 'Tavily receives the name and place of merchants paid by card; the chosen model gets name, description and amount, without IBANs. The keys stay on the device, outside the backup.',
    onlineOn: 'On: after every upload it looks up unknown merchants.',
    savedResults: n => plural(n, 'saved result', 'saved results') + '.',

    excelMissing: 'Excel reader not available.',

    noneNew: 'No new transactions.', dup: n => n === 1 ? '1 was already there.' : n + ' were already there.',

<script>
(function () {
  'use strict';
  const C = window.DSCore;
  const TEXT = window.DSText, LANGS = Object.keys(TEXT);
  // Nome precedente dell'app: la chiave dei dati e l'identificativo dei backup restano questi,
  // così i movimenti salvati e i backup già esportati continuano a funzionare.
  const KEY = 'dove-spendo:v1';
  const XLSX_URL = 'xlsx.full.min.js';

  const $ = s => document.querySelector(s);
  const content = $('#content'), toastEl = $('#toast'), fileInput = $('#file'), sheet = $('#sheet'), backdrop = $('#backdrop'), footEl = $('#foot');

  /* ---------- lingua ---------- */
  /* Quella scelta in Impostazioni, altrimenti l'italiano. Non è un dato: resta anche dopo «Cancella tutti i dati». */
  const KEY_LANG = KEY + ':lang';
  let lang = 'it';
  try { const v = localStorage.getItem(KEY_LANG); if (LANGS.includes(v)) lang = v; } catch (e) { /* resta l'italiano */ }
  let L, nf, nf0, pctf, dShort, dMonth, dMonthYear, dMonAbbr;
  /* Testi, numeri e date nella lingua scelta, anche nelle parti fisse della pagina. */
  function applyLang(id) {
    lang = id; L = TEXT[id];
    C.setLang(id);
    nf = new Intl.NumberFormat(L.locale, { style: 'currency', currency: 'EUR' });
    nf0 = new Intl.NumberFormat(L.locale, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, minimumFractionDigits: 0 });
    pctf = new Intl.NumberFormat(L.locale, { style: 'percent', maximumFractionDigits: 0 });
    dShort = new Intl.DateTimeFormat(L.locale, { day: 'numeric', month: 'short' });
    dMonth = new Intl.DateTimeFormat(L.locale, { month: 'long' });
    dMonthYear = new Intl.DateTimeFormat(L.locale, { month: 'long', year: 'numeric' });
    dMonAbbr = new Intl.DateTimeFormat(L.locale, { month: 'short' });
    if (document.documentElement) document.documentElement.lang = id;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', L[el.getAttribute('data-i18n-label')]));
  }
  applyLang(lang);
  const euro = c => nf.format(c / 100);
  const euro0 = c => nf0.format(Math.round(c / 100));
  const signed = c => (c > 0 ? '+' : c < 0 ? '−' : '') + euro(Math.abs(c));
  const toDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +(s.slice(8, 10) || 1));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const monthLabel = m => cap(dMonthYear.format(toDate(m + '-01')));
  const monthName = m => dMonth.format(toDate(m + '-01'));

  const ICON = {
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    down: '<path d="m6 9 6 6 6-6"/>',
    alert: '<path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5"/><path d="M12 17.5h.01"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    up: '<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
    dn: '<path d="M12 5v14"/><path d="m18 13-6 6-6-6"/>',
    same: '<path d="M5 12h14"/>',
    home: '<path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/>',
    basket: '<path d="m7 10 5-7 5 7M3 10h18l-2 10H5ZM9 14v3m6-3v3"/>',
    food: '<path d="M5 3v7a3 3 0 0 0 6 0V3M8 3v18M19 3c-4 3-4 8 0 9v9M19 3v9"/>',
    plane: '<path d="m21 3-7 18-3-8-8-3ZM11 13l10-10"/>',
    transit: '<rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 10h14M8 18l-2 3m10-3 2 3M9 14h.01M15 14h.01"/>',
    car: '<path d="M5 17H4a1 1 0 0 1-1-1v-3.5l2.2-4.9A2 2 0 0 1 7 6.5h10a2 2 0 0 1 1.8 1.1l2.2 4.9V16a1 1 0 0 1-1 1h-1M3 12.5h18M9 17h6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',
    sport: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    percent: '<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    bag: '<path d="M5 8h14l1 13H4ZM8 8V6a4 4 0 0 1 8 0v2"/>',
    repeat: '<path d="M3 8h14l-3-3m3 3-3 3M21 16H7l3 3m-3-3 3-3M3 8v5m18 3v-5"/>',
    health: '<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S4 8 5 4s7 4 7 4Zm0 0s8 0 7-4-7 4-7 4Z"/>',
    cash: '<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',
    dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4M10.5 7.5v6m-3-3h6"/>',
    book: '<path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4Zm16 0h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3Z"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4M8 14h.01M12 14h.01M16 14h.01"/>',
    close: '<path d="m6 6 12 12M6 18 18 6"/>'
  };
  function icon(name, cls) {
    const t = document.createElement('template');
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + ICON[name] + '</svg>';
    return t.content.firstChild;
  }
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return el;
  }

  /* ---------- dati ---------- */
  const emptyStore = () => ({ v: 1, tx: [], files: [], rules: {}, overrides: {}, cats: [], ai: {} });
  let storageOk = true;
  try { localStorage.setItem(KEY + ':t', '1'); localStorage.removeItem(KEY + ':t'); } catch (e) { storageOk = false; }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.tx)) return C.migrate(Object.assign(emptyStore(), s));
      }
    } catch (e) { /* dati illeggibili: si riparte da zero */ }
    return emptyStore();
  }
  let store = load();
  let demo = null;
  const isDemo = () => store.tx.length === 0;
  function active() {
    if (!isDemo()) return store;
    if (!demo) { demo = emptyStore(); C.merge(demo, C.rowsToTx(C.parseCSV(lang === 'en' ? C.EXAMPLE_CSV_EN : C.EXAMPLE_CSV), '2026-08-01_2026-08-31_esempio.csv')); }
    return demo;
  }
  function save() {
    if (isDemo()) return;
    try { localStorage.setItem(KEY, JSON.stringify(store)); storageOk = true; } catch (e) { storageOk = false; }
  }
  const ctxOf = s => ({ rules: s.rules, overrides: s.overrides, own: C.ownIbans(s.tx), ai: s.ai });
  const allCats = s => C.CATS.concat(s.cats || []);
  function catLabel(id, s) {
    if (!id) return L.uncategorized;
    if (id === 'giroconto') return L.internal;
    const c = allCats(s).concat(C.INCOME).find(x => x.id === id);
    return c ? C.catName(c) : id;
  }

  const CAT_STYLE = {
    affitto: { icon: 'home', color: '#60886d', chart: '#bad7b3' },
    spesa: { icon: 'basket', color: '#859b51', chart: '#d0dc96' },
    ristoranti: { icon: 'food', color: '#be7a63', chart: '#e9b5a1' },
    viaggi: { icon: 'plane', color: '#6594a4', chart: '#a6cbd6' },
    trasporti: { icon: 'transit', color: '#6587a8', chart: '#a6bddb' },
    macchina: { icon: 'car', color: '#7d7f96', chart: '#c1c2d8' },
    casa: { icon: 'home', color: '#b58e57', chart: '#dfc295' },
    abbonamenti: { icon: 'repeat', color: '#7c919d', chart: '#bbccd7' },
    shopping: { icon: 'bag', color: '#9580ac', chart: '#c9b8dc' },
    salute: { icon: 'health', color: '#b3758b', chart: '#ddb2c4' },
    sport: { icon: 'sport', color: '#5e9183', chart: '#a8cfc4' },
    svago: { icon: 'sun', color: '#ba954b', chart: '#e8d091' },
    regali: { icon: 'gift', color: '#b98075', chart: '#e7bfb0' },
    stipendio: { icon: 'cash', color: '#60886d', chart: '#bad7b3' },
    interessi: { icon: 'percent', color: '#688d80', chart: '#adcec1' },
    rimborsi: { icon: 'undo', color: '#6594a4', chart: '#a6cbd6' },
    giroconto: { icon: 'repeat', color: '#7c919d', chart: '#bbccd7' },
    __none: { icon: 'alert', color: '#bd9445', chart: '#e1bd76' }
  };
  const catStyle = id => CAT_STYLE[id] || { icon: 'dots', color: '#819580', chart: '#c2cfba' };
  function categorySymbol(id) {
    const v = catStyle(id);
    return h('span', { class: 'category-symbol', style: '--category:' + v.color, 'aria-hidden': 'true' }, icon(v.icon));
  }
  function spendSlices(sum) {
    const slices = sum.rows.filter(g => g.spent > 0).map(g => ({ id: g.id, value: g.spent }));
    if (sum.unOut) slices.push({ id: '__none', value: sum.unOut });
    return slices.sort((a, b) => b.value - a.value);
  }
  function spendingDonut(sum, s) {
    const slices = spendSlices(sum), circumference = 2 * Math.PI * 65;
    let offset = 0;
    const arcs = slices.map(v => {
      const size = sum.total ? v.value / sum.total * circumference : 0;
      const circle = '<circle cx="80" cy="80" r="65" fill="none" stroke="' + catStyle(v.id).chart + '" stroke-width="11" stroke-dasharray="' + Math.max(0, size - 3) + ' ' + circumference + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 80 80)"/>';
      offset += size;
      return circle;
    }).join('');
    const t = document.createElement('template');
    t.innerHTML = '<svg viewBox="0 0 160 160" role="img"><circle cx="80" cy="80" r="65" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="11"/>' + arcs + '</svg>';
    const svg = t.content.firstChild;
    svg.setAttribute('aria-label', slices.length ? L.donutLabel(slices.map(v => catLabel(v.id === '__none' ? '' : v.id, s) + ' ' + pctf.format(v.value / sum.total)).join(', ')) : L.noSpendMonth);
    return h('div', { class: 'hero-visual' },
      h('div', { class: 'donut' }, svg, h('div', { class: 'donut-center', 'aria-hidden': 'true' }, h('b', {}, slices.length), h('span', {}, L.categoryWord(slices.length)))));
  }
  function symbol(name) {
    return h('span', { class: 'category-symbol', 'aria-hidden': 'true' }, icon(name));
  }

  /* Tre cose da sapere: la spesa più grande, la media al giorno e la voce cambiata di più. */
  function highlights(sum, s, cmp) {
    const items = [];
    const item = (sym, label, title, sub, amt, amtCls, onclick) => h('li', { class: 'hl' },
      h(onclick ? 'button' : 'div', { class: 'hl-item', type: onclick ? 'button' : null, onclick: onclick || null, 'data-focus': onclick ? 'hl-big' : null },
        sym, h('span', { class: 'hl-label' }, label), h('span', { class: 'hl-title' }, title),
        sub ? h('span', { class: 'hl-sub' }, sub) : null,
        h('span', { class: 'hl-amt' + (amtCls ? ' ' + amtCls : '') }, amt)));
    const big = C.biggestExpense(sum);
    if (big) items.push(item(categorySymbol(big.cat || '__none'), L.biggest, C.displayName(big.t),
      dShort.format(toDate(big.t.date)) + ' · ' + catLabel(big.cat, s), euro(-big.t.cents), null, () => openSheet(big.t)));
    if (sum.total) {
      const days = C.daysCovered(ui.month, s.files);
      items.push(item(symbol('calendar'), L.dailyAvg, L.days(days), null, euro(Math.round(sum.total / days))));
    }
    const change = C.categoryChanges(cmp)[0];
    if (change && Math.abs(change.diff) >= 100) items.push(item(categorySymbol(change.id), change.diff > 0 ? L.grewMost : L.fellMost,
      catLabel(change.id, s), L.compared(monthName(cmp.prev), cmp.partial),
      (change.diff > 0 ? '+' : '−') + euro(Math.abs(change.diff)), change.diff > 0 ? 'up' : 'down'));
    if (!items.length) return null;
    return h('section', { class: 'card', id: 'highlights', 'aria-labelledby': 'hl-title' },
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title', id: 'hl-title' }, L.hlTitle)),
      h('ul', { class: 'highlights' }, items));
  }

  const ui = { month: null, open: new Set(), sheetTx: null, armed: null, armTimer: 0, focusId: null, online: { busy: false, done: 0, total: 0 } };

  /* ---------- avvisi ---------- */
  let toastTimer = 0;
  function say(msg, err) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!err);
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, err ? 9000 : 5000);
  }

  /* ---------- pagina ---------- */
  function render() {
    const s = active();
    const ctx = ctxOf(s);
    const months = C.monthsOf(s.tx);
    if (!months.includes(ui.month)) ui.month = months[months.length - 1] || null;
    const nodes = [];
    if (isDemo()) nodes.push(sampleBanner());
    if (ui.month) {
      const cov = C.coverage(ui.month, s.files);
      const sum = C.summarize(s.tx, ctx, ui.month);
      const cmp = C.compare(s.tx, ctx, ui.month, s.files);
      nodes.push(h('section', { class: 'overview', id: 'overview', 'aria-label': L.monthSummary }, monthBar(months, s), hero(sum, cov, s, cmp)));
      if (sum.unTx.length) nodes.push(attention(sum, s));
      const main = [categories(sum, s), merchantsCard(sum, s)];
      const side = [flowCard(sum, s), highlights(sum, s, cmp), trend(months, s, ctx)];
      nodes.push(h('div', { class: 'dashboard' }, h('div', { class: 'main-stack' }, main), h('div', { class: 'side-stack' }, side)));
    }
    nodes.push(h('section', { class: 'guide', id: 'guide', 'aria-label': L.navGuide },
      h('div', { class: 'settings-grid' }, help(), onlineCard()),
      isDemo() ? null : dataCard(s)));
    const inst = installCard();
    if (inst) nodes.push(inst);
    content.replaceChildren(...nodes);
    footEl.textContent = onlineReady() ? L.footOnline : L.footOffline;
    if (ui.focusId) {
      const el = content.querySelector('[data-focus="' + ui.focusId + '"]');
      if (el) el.focus({ preventScroll: true });
      ui.focusId = null;
    }
  }

  function sampleBanner() {
    return h('section', { class: 'sample', 'aria-label': L.sample },
      h('div', { class: 'sample-copy' }, h('span', { class: 'tag-sample' }, L.demoMode), h('p', {}, L.sampleData)),
      h('button', { class: 'linkish', type: 'button', onclick: pickFile }, L.uploadBanks, icon('right')));
  }

  /* Solo il nome della banca: l'estratto consolidato di Revolut ha un conto per prodotto e valuta. */
  const bankLabel = t => t.src === 'bunq' ? 'bunq' : t.src === 'revolut' ? 'Revolut' : C.accountLabel(t);

  function monthBar(months, s) {
    const i = months.indexOf(ui.month);
    const go = d => { ui.month = months[i + d]; ui.open.clear(); render(); };
    const accts = [...new Set(s.tx.filter(t => t.date.startsWith(ui.month)).map(bankLabel))];
    return h('div', { class: 'monthbar' },
      h('div', { class: 'monthnav' },
        h('label', { class: 'month-pick' },
          h('span', { class: 'sr-only' }, L.month),
          h('select', { id: 'month', onchange: e => { ui.month = e.target.value; ui.open.clear(); render(); } },
            months.slice().reverse().map(m => h('option', { value: m, selected: m === ui.month }, monthLabel(m)))),
          icon('down')),
        h('button', { class: 'round', type: 'button', 'aria-label': L.prevMonth, disabled: i <= 0, onclick: () => go(-1) }, icon('left')),
        h('button', { class: 'round', type: 'button', 'aria-label': L.nextMonth, disabled: i >= months.length - 1, onclick: () => go(1) }, icon('right'))),
      h('p', { class: 'accounts' }, isDemo() ? h('span', {}, L.madeUp) : accts.map(a => h('span', { class: 'mono' }, a))));
  }

  function hero(sum, cov, s, cmp) {
    const bits = [];
    if (cov.partial) bits.push(+cov.from.slice(8) === +cov.to.slice(8) ? L.onlyDay(+cov.from.slice(8), monthName(ui.month)) : L.dayRange(+cov.from.slice(8), +cov.to.slice(8), monthName(ui.month)));
    if (sum.unOut) bits.push(L.ofWhich(euro(sum.unOut)));
    const d = C.deltaOf(cmp);
    let deltaEl = null;
    if (d) {
      const p = Math.abs(d.ratio);
      const dir = p < 0.005 ? 'same' : d.ratio > 0 ? 'more' : 'less';
      const prev = monthName(d.prev);
      const text = dir === 'same' ? L.deltaSame(prev, d.partial) : (dir === 'more' ? L.deltaMore : L.deltaLess)(pctf.format(p), prev, d.partial);
      deltaEl = h('p', { class: 'delta ' + dir }, icon(dir === 'more' ? 'up' : dir === 'less' ? 'dn' : 'same'), text);
    }
    /* Entrate meno uscite: il bilancio del mese in una riga. */
    const rate = sum.inflow > 0 && sum.net >= 0 ? L.ofIncome(pctf.format(sum.net / sum.inflow)) : '';
    const facts = [
      h('li', {}, h('span', {}, L.income), h('b', {}, signed(sum.inflow))),
      h('li', {}, h('span', {}, L.outgoing), h('b', {}, signed(-sum.total))),
      h('li', { class: 'fact-net' + (sum.net < 0 ? ' neg' : '') }, h('span', {}, L.balance), h('b', {}, signed(sum.net)), rate ? h('small', {}, rate) : null)
    ];
    return h('section', { class: 'hero', 'aria-label': L.monthTotal },
      h('div', { class: 'hero-top' }, h('div', { class: 'hero-main' },
        h('p', { class: 'eyebrow' }, L.totalSpending(monthName(ui.month))),
        h('p', { class: 'hero-value' + (euro(sum.total).length > 8 ? ' long' : '') }, euro(sum.total)),
        bits.length ? h('p', { class: 'hero-sub' }, bits.join(', ')) : null,
        deltaEl), spendingDonut(sum, s)),
      h('ul', { class: 'facts', 'aria-label': L.inMinusOut }, facts));
  }

  function attention(sum, s) {
    const open = ui.open.has('__none');
    const n = sum.unTx.length;
    const list = sum.unTx.slice().sort((a, b) => Math.abs(b.t.cents) - Math.abs(a.t.cents));
    return h('section', { class: 'attn', id: 'attn' },
      h('button', { class: 'attn-head', type: 'button', 'aria-expanded': String(open), 'aria-controls': 'list-none', 'data-focus': 'attn', onclick: () => toggle('__none') },

        h('span', { class: 'grow' }, L.uncategorizedCount(n)),
        icon('right', 'chev')),
      onlineHint(),
      open ? txList(list, s, 'list-none') : null);

  function categories(sum, s) {
    const items = sum.rows.filter(g => g.spent > 0).map(g => Object.assign({ kind: 'cat' }, g));
    if (sum.unOut > 0) items.push({ id: '__none', kind: 'none', spent: sum.unOut, count: sum.unTx.filter(w => w.t.cents < 0).length });
    items.sort((a, b) => b.spent - a.spent);
    const zero = sum.rows.filter(g => g.spent === 0);
    const list = h('ul', { class: 'rows' });
    for (const g of items) list.append(catRow(g, sum.total, s, false));
    for (const g of zero) list.append(catRow(g, sum.total, s, true));
    if (!items.length && !zero.length) list.append(h('li', { class: 'empty' }, L.noSpending));
    return h('section', { class: 'card categories-card', id: 'categories', 'aria-labelledby': 'cat-title' },
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title', id: 'cat-title' }, L.yourCategories)),
      list);
  }

  function catRow(g, total, s, zero) {
    const none = g.kind === 'none';
    const open = !none && ui.open.has(g.id);
    const share = total > 0 ? g.spent / total : 0;
    const meta = [];
    if (none) meta.push(L.txCount(g.count));
    else {
      if (!zero) meta.push(pctf.format(share));
      if (g.back > 0) meta.push(L.received(zero ? euro(g.back) : '−' + euro(Math.min(g.back, g.out))));
    }
    const btn = h('button', {
      class: 'row-btn', type: 'button', 'data-focus': 'cat-' + g.id, style: '--category:' + catStyle(g.id).color,
      'aria-expanded': none ? null : String(open),
      onclick: () => none ? openAttention() : toggle(g.id)
    },
      categorySymbol(g.id),
      h('span', { class: 'row-name' }, catLabel(none ? '' : g.id, s)),
      h('span', { class: 'row-amt' }, euro(g.spent)),
      icon('right', 'row-chevron'),
      zero ? null : h('span', { class: 'track', 'aria-hidden': 'true' }, h('span', { class: 'fill', style: 'width:' + (share * 100).toFixed(2) + '%' })),
      meta.length ? h('span', { class: 'row-meta' }, meta.join(' · ')) : null);
    return h('li', { class: 'row' + (none ? ' warn' : '') + (zero ? ' zero' : '') }, btn,
      open ? txList(g.txs.slice().sort((a, b) => b.t.date.localeCompare(a.t.date) || a.t.cents - b.t.cents), s) : null);

  /* Elenco dei movimenti. Quelli ripetuti con la stessa controparte e categoria diventano una voce sola
     con il totale, che si apre al tocco; flat li elenca tutti. */
  function txList(ws, s, id, flat) {
    const items = flat ? ws.map(txItem) : C.groupTx(ws).map(g => g.ws.length === 1 ? txItem(g.ws[0]) : groupItem(g));

  function txItem(w) {
    const t = w.t;
    const inflow = t.cents > 0;
    const tags = [];
    if (w.note === 'cashback') tags.push(h('span', { class: 'tag' }, L.tagCashback));
    else if (w.note === 'contanti') tags.push(h('span', { class: 'tag' }, L.tagCash));
    else if (inflow && w.cat && w.cat !== 'giroconto' && !C.isIncome(w.cat)) tags.push(h('span', { class: 'tag' }, L.tagRefund));
    if (!w.cat && inflow) tags.push(h('span', { class: 'tag' }, L.tagIncome));
    const sub = [C.subline(t), w.how === 'online' ? w.why : ''].filter(Boolean).join(' · ');
    return h('li', {},
      h('button', { class: 'tx-btn', type: 'button', 'data-focus': 'tx-' + t.id, onclick: () => openSheet(t) },
        h('span', { class: 'tx-date' }, dShort.format(toDate(t.date))),
        h('span', { class: 'tx-name' }, C.displayName(t), tags),
        h('span', { class: 'tx-amt' + (inflow ? ' in' : '') }, (inflow ? '+' : '') + euro(Math.abs(t.cents))),

  function trend(months, s, ctx) {
    const last = months.slice(-12);
    const vals = last.map(m => {
      const sum = C.summarize(s.tx, ctx, m);
      return { m, total: sum.total, inflow: Math.max(0, sum.inflow), net: sum.net, partial: C.coverage(m, s.files).partial };
    });
    const showIn = vals.some(v => v.inflow > 0);
    const max = Math.max(1, ...vals.map(v => showIn ? Math.max(v.total, v.inflow) : v.total));
    const px = c => Math.max(2, Math.round((c / max) * 86));
    // La media conta solo i mesi completi: un mese parziale la abbasserebbe.
    const full = vals.filter(v => !v.partial);
    const avg = full.length > 1 ? full.reduce((n, v) => n + v.total, 0) / full.length : 0;
    const row = h('div', { class: 'trend' + (showIn ? ' paired' : '') }, vals.map(v => {
      const sel = v.m === ui.month;
      const outPx = px(v.total), inPx = showIn && v.inflow ? px(v.inflow) : 0;
      return h('button', {
        class: 'col', type: 'button', 'aria-pressed': String(sel),
        'aria-label': L.trendLabel(monthLabel(v.m), euro(v.total), showIn ? euro(v.inflow) : '', showIn ? signed(v.net) : '', v.partial),
        onclick: () => { ui.month = v.m; ui.open.clear(); render(); }
      },
        h('span', { class: 'col-plot' },
          showIn ? h('span', { class: 'col-bar in', style: 'height:' + inPx + 'px' }) : null,
          h('span', { class: 'col-bar out', style: 'height:' + outPx + 'px' }),
          avg ? h('span', { class: 'col-avg', style: 'bottom:' + Math.round((avg / max) * 86) + 'px', 'aria-hidden': 'true' }) : null,
          sel ? h('span', { class: 'col-val', style: 'bottom:' + (Math.max(outPx, inPx) + 6) + 'px' }, euro0(v.total)) : null),
        h('span', { class: 'col-lab' }, cap(dMonAbbr.format(toDate(v.m + '-01'))).replace('.', '') + (v.partial ? '*' : '')));
    }));
    const legend = [];
    if (showIn) legend.push(h('span', { class: 'key in' }, L.income), h('span', { class: 'key out' }, L.spending));
    if (avg) legend.push(h('span', { class: 'key avg' }, L.average(euro0(avg))));
    return h('section', { class: 'card', id: 'trend', 'aria-labelledby': 'trend-title' },
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title', id: 'trend-title' }, L.navTrend)),
      row,
      legend.length ? h('p', { class: 'trend-legend' }, legend) : null,
      vals.some(v => v.partial) ? h('p', { class: 'trend-note' }, L.partialNote) : null);
  }

  /* Le entrate per categoria e i giroconti, ciascuno come un solo totale. Entrate, uscite e saldo
     sono già nel riquadro del mese. */
  function flowCard(sum, s) {
    const simple = (id, label, amount, ws, note) => {
      const open = ui.open.has(id);
      return h('li', { class: 'row' },
        h('button', { class: 'row-btn row-simple', type: 'button', 'aria-expanded': String(open), 'data-focus': 'cat-' + id, onclick: () => toggle(id) },
          categorySymbol(id), h('span', { class: 'row-name' }, label),
          h('span', { class: 'row-amt' }, amount),
          icon('right', 'row-chevron'),
          h('span', { class: 'row-meta' }, [L.txCount(ws.length), note].filter(Boolean).join(' · '))),
        open ? txList(ws.slice().sort((a, b) => b.t.date.localeCompare(a.t.date)), s) : null);
    };
    const rows = sum.incomeRows.map(g => simple(g.id, catLabel(g.id, s), signed(g.total), g.txs));
    if (sum.internalTx.length) {
      const amt = sum.internalOut ? euro(sum.internalOut) : '+' + euro(sum.internalIn);
      rows.push(simple('giroconto', L.internals, amt, sum.internalTx, L.outsideBalance));
    }
    const notes = [];
    if (sum.unIn) notes.push(L.noteUnIn(euro(sum.unIn)));
    if (sum.back) notes.push(L.noteBack(euro(sum.back)));
    if (sum.extraBack) notes.push(L.noteExtra(euro(sum.extraBack)));
    if (sum.otherCur) notes.push(L.noteOtherCur(sum.otherCur));
    if (!rows.length && !notes.length) return null;
    return h('section', { class: 'card flow-card', id: 'flow', 'aria-labelledby': 'flow-title' },
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title', id: 'flow-title' }, L.flowTitle)),
      rows.length ? h('ul', { class: 'rows' }, rows) : null,
      notes.length ? h('p', { class: 'flow-notes' }, notes.join(' ')) : null);
  }

  function rangeLabel(f) {
    if (!f.from || !f.to) return L.unknownPeriod;
    const a = toDate(f.from), b = toDate(f.to);
    const sameYear = a.getFullYear() === b.getFullYear();
    const fa = new Intl.DateTimeFormat(L.locale, sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' }).format(a);
    const fb = new Intl.DateTimeFormat(L.locale, { day: 'numeric', month: 'short', year: 'numeric' }).format(b);
    return L.range(fa, fb);
  }

  function armButton(id, label, confirmLabel, action, cls) {

    forgetKeys();
